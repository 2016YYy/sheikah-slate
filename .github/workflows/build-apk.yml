name: Build Android APK

on:
  # 手动触发：仓库 Actions 页点击「Run workflow」
  # 填 release_tag 可把 APK 挂到对应 Release；留空则不挂载
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要挂载 APK 的 Release 标签（如 v1.0.0），留空则不挂载'
        required: false
        default: ''
  # 发版触发：推送 v* 标签（如 v1.0.1）时自动出包并挂到对应 Release
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate data modules
        run: python3 scripts/gen_data.py

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version from tag
        run: |
          # 从 git 标签提取版本（如 v1.0.0 -> 1.0.0），无标签时使用 package.json
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          # versionCode: major*10000 + minor*100 + patch (1.0.0 -> 10000)
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          echo "versionName=$VERSION versionCode=$VERSION_CODE"
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Inject REQUEST_INSTALL_PACKAGES permission
        run: |
          # 应用内更新安装 APK 所需权限，cap add 生成的 manifest 默认不含
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>|' "$MANIFEST"
          fi
          echo "=== Updated AndroidManifest.xml permissions ==="
          grep "uses-permission" "$MANIFEST"

      - name: Inject signing config into build.gradle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          BUILD_GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
            python3 - "$BUILD_GRADLE" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          signing = (
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file(System.getenv(\"KEYSTORE_PATH\"))\n"
              "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n"
          )
          content = content.replace("    buildTypes {", signing + "    buildTypes {")
          content = content.replace(
              "            minifyEnabled false",
              "            minifyEnabled false\n            signingConfig signingConfigs.release"
          )
          with open(path, "w") as f:
              f.write(content)
          PYEOF
          fi
          echo "=== signing config injected ==="
          grep -A2 "signingConfigs" "$BUILD_GRADLE" | head -6

      - name: Decode keystore (release signing)
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "keystore_decoded=true" >> $GITHUB_OUTPUT
          echo "Release keystore decoded"

      - name: Build APK (release if keystore available, else debug)
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_decoded == 'true' && 'app/release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -f app/release.keystore ]; then
            echo "Building release APK..."
            ./gradlew assembleRelease
          else
            echo "No keystore found, building debug APK..."
            ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheikah-slate-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd android
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Uploading $APK to release $RELEASE_TAG"
          gh release upload "${RELEASE_TAG}" "$APK" --clobber
