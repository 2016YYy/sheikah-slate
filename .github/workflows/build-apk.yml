name: Build Android APK

on:
  # 手动触发：仓库 Actions 页点击「Run workflow」
  workflow_dispatch:
  # 发版触发：推送 v* 标签（如 v1.0.1）时自动出包并挂到对应 Release
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate data modules
        run: python3 scripts/gen_data.py

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheikah-slate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android
          gh release upload "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/app-debug.apk --clobber
