name: Build Android APK

on:
  # 手动触发：仓库 Actions 页点击「Run workflow」
  # 填 release_tag 可把 APK 挂到对应 Release；留空则不挂载
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要挂载 APK 的 Release 标签（如 v1.0.0），留空则不挂载'
        required: false
        default: ''
  # 发版触发：推送 v* 标签（如 v1.0.1）时自动出包并挂到对应 Release
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate data modules
        run: python3 scripts/gen_data.py

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheikah-slate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd android
          gh release upload "${RELEASE_TAG}" \
            app/build/outputs/apk/debug/app-debug.apk --clobber
